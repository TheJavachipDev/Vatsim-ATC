services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vatsim
      POSTGRES_PASSWORD: vatsim
      POSTGRES_DB: vatsim_atc
    # Listen on all interfaces so published port 5432 accepts remote clients.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatsim -d vatsim_atc"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    environment:
      DATABASE_URL: postgres://vatsim:vatsim@postgres:5432/vatsim_atc
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    environment:
      DATABASE_URL: postgres://vatsim:vatsim@postgres:5432/vatsim_atc
      CONTACT_EMAIL: ${CONTACT_EMAIL:-you@example.com}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgres://vatsim:vatsim@postgres:5432/vatsim_atc
      PORT: ${PORT:-3000}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-you@example.com}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
